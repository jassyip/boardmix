<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="BoardMix 家庭棋盘游戏平台：五子棋、躲炸弹和经典飞行棋，支持五级电脑对手。">
  <title>百变棋盘 BoardMix 3.2</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/assets/app.css?v=3.2.0">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">◆</span><div><h1>百变棋盘</h1><small>BoardMix 3.2 · 五级电脑对手</small></div></div>
    <div class="top-actions"><button id="soundBtn" class="icon-btn" aria-label="切换音效">🔊</button></div>
  </header>

  <main>
    <section id="lobbyScreen" class="screen active lobby-screen">
      <div class="hero">
        <div><span class="eyebrow">Vercel · PWA · 本地AI</span><h2>一台手机，三款棋，随时开局。</h2><p>五子棋、躲炸弹和经典十字飞行棋全部支持真人或电脑，电脑难度分为 1–5 级。一级刻意友好，一年级小朋友也能轻松获胜。</p></div>
        <div class="hero-badge"><strong>5</strong><span>级电脑难度</span></div>
      </div>
      <div class="game-grid">
        <button class="game-card gomoku-card" data-open-game="gomoku"><div class="card-icon"><i class="stone dark"></i><i class="stone light"></i></div><h3>五子棋</h3><p>15×15 棋盘、多局赛制、五级电脑、自动换先。</p><span>进入棋局 →</span></button>
        <button class="game-card bomb-card" data-open-game="bomb"><div class="card-icon">💣</div><h3>躲炸弹</h3><p>安全路径地图、线索推理、雷达扫描、无作弊电脑。</p><span>进入棋局 →</span></button>
        <button class="game-card ludo-card" data-open-game="ludo"><div class="card-icon">✈</div><h3>经典飞行棋</h3><p>四角机场、十字航线、四架飞机、清晰骰子。</p><span>进入棋局 →</span></button>
      </div>
    </section>

    <section id="gomokuScreen" class="screen game-screen">
      <div class="game-shell">
        <header class="game-header"><button class="round-btn" data-back aria-label="返回大厅">←</button><div><strong>五子棋</strong><span id="gomokuStatus">准备开局</span></div><button class="round-btn" data-fullscreen aria-label="全屏">⛶</button></header>
        <div class="player-strip two">
          <div id="gPlayer0Chip" class="player-chip"><span class="avatar black">●</span><div><b id="gPlayer0Name">玩家一</b><small id="gPlayer0Meta">真人 · 黑方</small></div><strong id="gPlayer0Score">0</strong></div>
          <div id="gPlayer1Chip" class="player-chip reverse"><strong id="gPlayer1Score">0</strong><div><b id="gPlayer1Name">玩家二</b><small id="gPlayer1Meta">电脑3级 · 白方</small></div><span class="avatar white">○</span></div>
        </div>
        <div class="board-area"><div class="board-frame gomoku-frame"><canvas id="gomokuCanvas" width="900" height="900" aria-label="五子棋棋盘"></canvas><div id="gomokuThinking" class="thinking hidden">电脑思考中…</div></div></div>
        <footer class="game-toolbar"><button id="gUndo">↶ 悔棋</button><button id="gRestart">↻ 重开本局</button><button id="gTheme">🎨 主题</button><button id="gSettings" class="primary">⚙ 设置</button></footer>
      </div>
    </section>

    <section id="bombScreen" class="screen game-screen">
      <div class="game-shell">
        <header class="game-header"><button class="round-btn" data-back aria-label="返回大厅">←</button><div><strong>躲炸弹</strong><span id="bombStatus">红方行动</span></div><button class="round-btn" data-fullscreen aria-label="全屏">⛶</button></header>
        <div class="player-strip two">
          <div id="bPlayer0Chip" class="player-chip"><span class="avatar red">1</span><div><b id="bPlayer0Name">红方</b><small id="bPlayer0Meta">真人</small></div><strong id="bLife0">♥♥♥</strong></div>
          <div id="bPlayer1Chip" class="player-chip reverse"><strong id="bLife1">♥♥♥</strong><div><b id="bPlayer1Name">蓝方</b><small id="bPlayer1Meta">电脑3级</small></div><span class="avatar blue">2</span></div>
        </div>
        <div class="board-area"><div id="bombFrame" class="board-frame bomb-frame" data-theme="cyber"><div id="bombBoard" class="bomb-board" aria-label="躲炸弹棋盘"></div><div id="bombThinking" class="thinking hidden">电脑分析线索中…</div></div></div>
        <footer class="game-toolbar"><button id="bScan">📡 雷达</button><button id="bRestart">↻ 新地图</button><button id="bTheme">🎨 主题</button><button id="bSettings" class="primary">⚙ 设置</button></footer>
      </div>
    </section>

    <section id="ludoScreen" class="screen game-screen">
      <div class="game-shell ludo-shell">
        <header class="game-header"><button class="round-btn" data-back aria-label="返回大厅">←</button><div><strong>经典飞行棋</strong><span id="ludoStatus">红方掷骰</span></div><button class="round-btn" data-fullscreen aria-label="全屏">⛶</button></header>
        <div id="ludoPlayers" class="ludo-player-strip"></div>
        <div class="board-area ludo-area">
          <div class="board-frame ludo-frame">
            <div id="ludoBoard" class="ludo-board" aria-label="经典十字飞行棋棋盘"></div>
            <div class="dice-panel"><div id="die" class="die" aria-label="骰子点数 1"></div><strong id="dieValue">1</strong><button id="rollDice" class="roll-btn">投掷骰子</button></div>
            <div id="ludoThinking" class="thinking hidden">电脑正在选择飞机…</div>
          </div>
        </div>
        <footer class="game-toolbar"><button id="ludoRestart">↻ 重开</button><button id="ludoTheme">🎨 主题</button><button id="ludoSettings" class="primary">⚙ 玩家设置</button></footer>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal" aria-hidden="true"><div class="modal-card"><button id="modalClose" class="modal-close" aria-label="关闭">×</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>

<script type="module" src="/assets/app.js?v=3.2.0"></script>
</body>
</html>
